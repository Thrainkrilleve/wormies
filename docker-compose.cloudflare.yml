x-app-common: &app-common
  image: wormhole-systems:production
  build:
    context: .
    dockerfile: dockerfiles/common/frankenPHP/Dockerfile
    args:
      - VITE_REVERB_APP_KEY
      - VITE_REVERB_HOST
      - VITE_REVERB_PORT
      - VITE_REVERB_SCHEME
  env_file:
    - .env
  extra_hosts:
    - "auth.localhost:host-gateway"
    - "host.docker.internal:host-gateway"
  networks:
    - ws-internal
  volumes:
    - laravel-storage:/app/storage
    - ./dockerfiles/common/frankenPHP/php.ini:/usr/local/etc/php/conf.d/custom.ini

services:
  app:
    <<: *app-common
    container_name: wormholesystems-app
    ports:
      - "${APP_HOST_PORT:-8090}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:80/up"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mariadb:11.2
    hostname: mysql
    container_name: wormholesystems-mysql
    env_file:
      - dockerfiles/mysql/.env
    networks:
      - ws-internal
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-logs:/var/log/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2
    hostname: redis
    container_name: wormholesystems-redis
    networks:
      - ws-internal
    volumes:
      - redis-logs:/var/log/redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  queue:
    <<: *app-common
    container_name: wormholesystems-queue
    tty: true
    deploy:
      mode: replicated
      replicas: 4
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php artisan queue:work"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app-common
    container_name: wormholesystems-scheduler
    tty: true
    command: ["supercronic", "-overlapping", "/etc/supercronic/laravel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php /app/artisan schedule:run"]
      interval: 10s
      timeout: 5s
      retries: 3

  killmail-listener:
    <<: *app-common
    container_name: wormholesystems-killmails
    tty: true
    command: php artisan app:listen-for-killmails
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php artisan app:listen-for-killmails"]
      interval: 10s
      timeout: 5s
      retries: 3

  reverb:
    <<: *app-common
    container_name: wormholesystems-reverb
    tty: true
    ports:
      - "${REVERB_HOST_PORT:-8091}:8080"
    depends_on:
      app:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
  laravel-storage:
  caddy_data:
  caddy_config:
  mysql-logs:
  redis-logs:

networks:
  ws-internal:
