[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "allianceauth-wormholesystems"
dynamic = ["version"]
description = "Wormhole Systems single sign-on & sidebar app for Alliance Auth"
readme = "allianceauth-wormholesystems/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wormhole Systems" }]
dependencies = ["allianceauth>=4.0.0"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/Thrainkrilleve/wormies"

[tool.setuptools.package-dir]
"" = "allianceauth-wormholesystems"

[tool.setuptools.packages.find]
where = ["allianceauth-wormholesystems"]

# A pip install of git+...@vX.Y.Z records X.Y.Z from that tag.
# fallback_version is only used when git metadata is absent. The publish
# workflow stamps it to the tag before the image build.
[tool.setuptools-scm]
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
fallback_version = "0.0.21"
local_scheme = "no-local-version"
